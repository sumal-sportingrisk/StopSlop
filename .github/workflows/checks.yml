name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install R system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-dev
      - name: Install R lint tooling
        run: Rscript --vanilla -e 'install.packages("lintr", repos = "https://cloud.r-project.org")'
      - name: Lint maintained Python code
        run: ruff check scripts evals/prepare.py evals/test_prepare.py tests
      - name: Check maintained Python security
        run: bandit -c pyproject.toml -r scripts evals/prepare.py
      - name: Validate skill packages and documentation
        run: python scripts/check_packages.py
      - name: Test package checks
        run: python -B -m unittest discover -s tests -v
      - name: Test evaluation preparation and fixture starting states
        run: python -B -m unittest discover -s evals -p 'test_prepare.py' -v
      - name: Lint maintained R checks
        run: Rscript --vanilla -e 'findings <- lintr::lint_dir("tests"); print(findings); if (length(findings)) quit(status = 1L)'
      - name: Execute R reference examples
        run: Rscript --vanilla tests/check_r_examples.R

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner'
      - name: Scan current files for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'
      - name: Check the fixture exception still detects other secrets
        run: python3 scripts/check_secret_controls.py "$RUNNER_TEMP/gitleaks"
